[NameGeneration]
# Name validation constraints
SingleWordNameLengthRange = [5,15]
ComposedWordLengthMax = 10

[NameCycle]
# Prime step values for name cycling (ensures all names are used before repeating)
PrimeSteps = 2,29,73,113,179,229,283,349,419,463,547,601

[DistrictGeneration]
# Prefix/suffix application probabilities (1/N chance)
DistrictPrefixOddsDenominator = 2
DistrictSuffixOddsDenominator = 3

# District type weights (used for weighted random selection)
DistrictTypeWeights = 4,3,2,1,1,1

# District attribute ranges
DistrictWealthRange = [1,6]
DistrictRoughRange = [1,6]

# Response time calculation
ResponseTimeBase = 5
ResponseTimeWealthMod = 10
ResponseTimeRandomAdd = 6

[LandmarkGeneration]
# Landmark size weights
LandmarkSizeWeights = 1,3,4,2

# Staff count per landmark size
StaffCountWeights = 2,6,20,60
StaffCountVariance = 2

# Crime factor calculation
CrimeRoughMult = 5
CrimeRandomRange = [-10,10]
CrimeDistrictTypeMult = 1,1,1,2,1,2

# Landmark positioning
LandmarkPositionMax = 45

[CitySize]
# Number of districts per city size
NumDistricts = 1,3,5,9

# Number of landmarks per city size
NumLandmarks = 5,15,40,80

[Transit]
# Walking transit time calculation
# Grid with x=travel_mode(walk,drive); y=travel_phase(day,night,rush)
TransitTimeMult = 4,4,4,1,1,2
TransitTimeAdd = 1,1,2,2,1,2

# Transit time variance
TransitTimeVariance = 1

# Prune percentage (culls random transit entries)
TransitPrunePercent = 10

[Population]
# Population calculation multipliers
NumActorsPerLandmark = 3
NumActorsPerDistrict = 5

# Actor attribute ranges
ActorWealthRange = [1,6]

# Gender distribution (1/N chance for male, else female)
GenderOddsDenominator = 2

[Files]
# Asset file paths
AssetsHomeDir = "../assets/"
CityNamesFile = "city_names.csv"
FemaleNamesFile = "f_names.csv"
MaleNamesFile = "m_names.csv"

# Database backup file
DatabaseBackupFile = "detective.db"
